name: PR Build and Test

on:
  pull_request:
    branches: [main]

# Cancel any in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: Install pnpm
        # No `version:` — the action reads `packageManager` from package.json,
        # so there is a single pnpm pin to bump.
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Run unit tests
        run: pnpm test:coverage

      - name: Run e2e tests
        run: pnpm test:e2e:docker

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: false

  # Builds both shipped images (the e2e job builds Dockerfile.e2e, so the
  # production images are otherwise never exercised in CI) for every published
  # platform: the default Debian image (`Dockerfile`, amd64 + arm64) and the
  # `-alpine` variant (`Dockerfile.alpine`, amd64 + arm64 + arm/v7). Each image
  # must run unprivileged as uid 1000, load its native better-sqlite3 binary and
  # resolve IANA time zones. The arm builds run under QEMU emulation and catch
  # arch-specific build/prebuild regressions pre-merge, before the main-branch
  # publish assembles the multi-arch manifests.
  #
  # All images are exercised in a single job (rather than a matrix) so the
  # status-check context stays named `docker-image` — a matrix would emit
  # `docker-image (linux/amd64)` / `(linux/arm64)` instead and break any branch
  # protection rule that requires the `docker-image` context.
  docker-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `docker buildx` in a run step needs the Actions runtime token/URLs for
      # the GitHub Actions cache backend (build-push-action exports them itself).
      - name: Expose GitHub Actions runtime for the build cache
        # Third-party action that handles the runtime token: pinned by commit SHA.
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and verify production images
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # verify <dockerfile> <variant> <release cache scope> <platform>
          verify() {
            local dockerfile="$1" variant="$2" release_scope="$3" platform="$4"
            echo "::group::Build + verify ${variant} ${platform}"
            # Reuse layers from main's release build and this PR's earlier runs,
            # so the arm/v7 SQLite compile only reruns when dependencies change.
            # GitHub already isolates caches by ref; the PR number makes the
            # per-PR scope explicit.
            local scope="pr-${PR_NUMBER}-${variant}-${platform//\//-}"
            docker buildx build --file "${dockerfile}" --platform "${platform}" --load -t actual-auto-sync:ci \
              --cache-from "type=gha,scope=${release_scope}" \
              --cache-from "type=gha,scope=${scope}" \
              --cache-to "type=gha,mode=max,scope=${scope}" \
              .

            local uid
            uid="$(docker run --rm --platform "${platform}" --entrypoint sh actual-auto-sync:ci -c 'id -u')"
            echo "runtime uid (${variant} ${platform}): ${uid}"
            if [ "${uid}" != "1000" ]; then
              echo "::error::[${variant} ${platform}] expected the container to run as uid 1000, got ${uid}"
              exit 1
            fi

            # Load the native SQLite binary and run a query — this is the
            # arch-specific risk (each arch's binary must match the runtime ABI) —
            # and resolve the default TIMEZONE, which needs ICU time zone data.
            docker run --rm --platform "${platform}" --entrypoint node actual-auto-sync:ci \
              -e "const D=require('better-sqlite3'); const db=new D(':memory:'); if (db.prepare('select 42 as n').get().n !== 42) { process.exit(1); } new Intl.DateTimeFormat('en-US', { timeZone: process.env.TIMEZONE }).format(0); console.log('better-sqlite3 + time zones OK on', process.arch, process.version);"
            echo "::endgroup::"
          }

          for platform in linux/amd64 linux/arm64; do
            verify Dockerfile debian release "${platform}"
          done
          for platform in linux/amd64 linux/arm64 linux/arm/v7; do
            verify Dockerfile.alpine alpine release-alpine "${platform}"
          done
